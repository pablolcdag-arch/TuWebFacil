<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuWebFacil - Login Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass-card rounded-3xl p-10 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black italic tracking-tighter text-blue-500 mb-2">TuWebFacil<span class="text-white">_Admin</span></h1>
            <p class="text-slate-400 text-sm">Acceso Restringido</p>
        </div>
        
        {% if error %}
            <div class="bg-red-500/20 border border-red-500/50 text-red-400 p-4 rounded-xl mb-6 text-sm text-center">
                <i class="fas fa-exclamation-circle mr-2"></i> {{ error }}
            </div>
        {% endif %}
        
        <form action="/admin/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">Contraseña de Administrador</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" name="password" required autofocus
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 transition shadow-inner">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-500/30 flex items-center justify-center">
                Ingresar al Panel <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </form>
    </div>
</body>
</html>
